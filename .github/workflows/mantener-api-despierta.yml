# El plan gratuito de Render apaga la API despues de 15 minutos sin
# visitas, y el primero que entra espera casi un minuto a que arranque.
# Esta tarea le pega cada 10 minutos para que no llegue a dormirse.
#
# Vive en este repo y no en el del backend porque aca, al ser publico,
# los minutos de GitHub Actions son ilimitados.

name: Mantener la API despierta

on:
  schedule:
    - cron: "*/10 * * * *"
  # Permite correrla a mano desde la pestana Actions
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar al health de la API
        # --max-time largo por si justo la agarra dormida y tiene que arrancar
        run: curl -fsS --max-time 120 https://yosiart-api.onrender.com/api/health
